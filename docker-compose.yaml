services:
  db:
    image: postgres:15
    container_name: vGarage
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vGarage
    ports:
      - "5432:5432"
    volumes:
      - vgarage_data:/var/lib/postgresql/data

volumes:
  vgarage_data: